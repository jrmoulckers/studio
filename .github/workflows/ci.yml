name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    permissions:
      contents: read
      pull-requests: read
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-lint.yml@97ff60ec21321563fa0fc7ba80015261e7dcd6fa
    with:
      node-version: '24'
      package-manager: pnpm
      lint-command: pnpm lint
      format-check-command: pnpm format:check
      semantic-pr-title: true

  web:
    name: web
    permissions:
      contents: read
    uses: jrmoulckers/.github/.github/workflows/reusable-ci-web.yml@97ff60ec21321563fa0fc7ba80015261e7dcd6fa
    with:
      node-version: '24'
      package-manager: pnpm
      typecheck-command: pnpm typecheck
      test-command: pnpm test
      build-command: pnpm -r build

  security:
    name: security
    permissions:
      contents: read
    uses: jrmoulckers/.github/.github/workflows/reusable-security-ci.yml@97ff60ec21321563fa0fc7ba80015261e7dcd6fa
    with:
      node-version: '24'
      package-manager: pnpm
      run-package-audit: true
      run-secret-scan: true
      # Studio does not have the dependency-review API capability.
      run-dependency-review: false
      dependency-fail-severity: high

  tokens_dist:
    name: tokens-dist-freshness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (verified 2026-08-03)
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (verified 2026-08-03)
        with:
          version: 10.16.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (verified 2026-08-03)
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fails if the committed packages/tokens/dist/ tree drifts from the tokens
      # sources (regenerates dist, then asserts no git diff).
      - name: Tokens dist freshness
        run: pnpm tokens:dist:check

  format_windows:
    name: format-windows
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (verified 2026-08-03)
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0 (verified 2026-08-03)
        with:
          version: 10.16.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0 (verified 2026-08-03)
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

  # Studio owns native codegen correctness. The backbone sync engine transports these
  # files but never compiles them, so a malformed emission would otherwise only surface
  # in a consuming member's build, one repo away. See issue #58.
  native_kotlin:
    name: native-kotlin
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      KOTLIN_VERSION: 2.1.20
      KOTLIN_SHA256: a118197b0de55ffab2bc8d5cd03a5e39033cfb53383d6931bc761dec0784891a
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (verified 2026-08-03)
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0 (verified 2026-08-10)
        with:
          distribution: temurin
          java-version: '21'

      - name: Install kotlinc
        run: |
          curl -fsSL -o kotlin-compiler.zip \
            "https://github.com/JetBrains/kotlin/releases/download/v${KOTLIN_VERSION}/kotlin-compiler-${KOTLIN_VERSION}.zip"
          echo "${KOTLIN_SHA256}  kotlin-compiler.zip" | sha256sum --check --strict
          unzip -q kotlin-compiler.zip -d "${RUNNER_TEMP}/kotlin"

      # Compiled against the minimal Compose stubs in packages/tokens/test/native/,
      # which type-check the generated source without pulling in the Android SDK.
      # See that directory's README for what this does and does not prove.
      - name: Compile generated Kotlin tokens
        run: |
          "${RUNNER_TEMP}/kotlin/kotlinc/bin/kotlinc" \
            packages/tokens/dist/native/compose/JrmTokens.kt \
            packages/tokens/test/native/androidx-compose-graphics-stub.kt \
            packages/tokens/test/native/androidx-compose-unit-stub.kt \
            -d "${RUNNER_TEMP}/kotlin-out" \
            -nowarn

  native_swift:
    name: native-swift
    runs-on: macos-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0 (verified 2026-08-03)
        with:
          persist-credentials: false

      # swiftc and the SDK ship on the macOS runner, so unlike the Kotlin job this is a
      # genuine type-check against real SwiftUI rather than against stubs.
      - name: Type-check generated Swift tokens
        run: |
          swift --version
          swiftc -typecheck packages/tokens/dist/native/swift/JRMTokens.swift

  build:
    name: build
    if: ${{ always() }}
    needs: [lint, web, security, tokens_dist, format_windows, native_kotlin, native_swift]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require successful CI jobs
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          WEB_RESULT: ${{ needs.web.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          TOKENS_RESULT: ${{ needs.tokens_dist.result }}
          WINDOWS_RESULT: ${{ needs.format_windows.result }}
          KOTLIN_RESULT: ${{ needs.native_kotlin.result }}
          SWIFT_RESULT: ${{ needs.native_swift.result }}
        run: |
          if [[ "$LINT_RESULT" != "success" ||
                "$WEB_RESULT" != "success" ||
                "$SECURITY_RESULT" != "success" ||
                "$TOKENS_RESULT" != "success" ||
                "$WINDOWS_RESULT" != "success" ||
                "$KOTLIN_RESULT" != "success" ||
                "$SWIFT_RESULT" != "success" ]]; then
            echo "Required CI job failed: lint=$LINT_RESULT, web=$WEB_RESULT, security=$SECURITY_RESULT, tokens=$TOKENS_RESULT, windows=$WINDOWS_RESULT, kotlin=$KOTLIN_RESULT, swift=$SWIFT_RESULT"
            exit 1
          fi
